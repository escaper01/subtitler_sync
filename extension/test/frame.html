<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nested player</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #111;
        color: #d4d4d4;
        font: 13px/1.5 system-ui, sans-serif;
      }
      video { width: 100%; background: #000; border-radius: 4px; display: block; }
      button {
        background: #171717; color: #e5e5e5; border: 1px solid #404040;
        border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
      .status { color: #38bdf8; font-family: monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <video id="video" controls playsinline></video>
    <div class="row">
      <button id="short">10s clip</button>
      <button id="long">100s clip</button>
      <span id="status" class="status">No clip yet.</span>
    </div>

    <script type="module">
      import { setupHarness } from './harness.js';

      const shortBtn = document.getElementById('short');
      const longBtn = document.getElementById('long');
      const buttons = [shortBtn, longBtn];

      const harness = setupHarness({
        video: document.getElementById('video'),
        status: document.getElementById('status'),
        label: 'nested frame',
        buttons,
      });

      shortBtn.addEventListener('click', () => harness.record(10));
      longBtn.addEventListener('click', () => harness.record(100));
    </script>
  </body>
</html>
