<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Fullscreen — placeholder">
  <rect width="800" height="500" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#22304a"/>

  <!-- A player frame, so the shape reads as a screenshot before one exists. -->
  <rect x="56" y="52" width="688" height="340" rx="8" fill="#05090f" stroke="#22304a"/>

  <!-- Two subtitle lines, the mark's own motif. -->
  <rect x="292" y="332" width="216" height="12" rx="6" fill="#38bdf8" opacity="0.85"/>
  <rect x="244" y="354" width="312" height="12" rx="6" fill="#38bdf8" opacity="0.5"/>

  <text x="400" y="440" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="19" fill="#e8eef7">Fullscreen</text>
  <text x="400" y="466" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#93a3bc">replace public/screenshots/fullscreen</text>
</svg>
